[project]
name = "customer-portal"
version = "0.1.0"
description = "Customer Portal backend API — customer identity domain"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "anyio>=4.0",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.3",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "T20", "ANN", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Use app.core.config.get_settings() instead of os.environ directly."
"os.getenv".msg = "Use app.core.config.get_settings() instead of os.getenv directly."

# Test fixtures legitimately set env vars to configure the process under test
# (e.g. pointing alembic's CLI at the ephemeral testcontainer database) — this
# is fixture wiring, not application runtime config, so the rule doesn't apply.
# S101/S105/S106: assertions and literal password fixtures are the normal shape
# of a test suite, not a real secret or a production assert-for-control-flow.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251", "S101", "S105", "S106"]
# alembic's process_revision_directives callback signature is untyped upstream;
# this mirrors the documented mypy `Any` exemption for these two functions only.
"migrations/env.py" = ["ANN401"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "unit: fast, no external services",
    "integration: requires Postgres via testcontainers",
]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

# ---------------------------------------------------------------- Contract 1
# Per-module layers. Wildcarded so a new module under app.modules is covered
# automatically, with no manual contract edit required (AGENTS.md §7.9 config-
# drift note).
[[tool.importlinter.contracts]]
name = "Module layers: router -> dependencies -> service -> repository|cache -> models|schemas"
type = "layers"
layers = [
    "router",
    "(dependencies)",
    "service",
    "repository | (cache)",
    "models | schemas",
    "(exceptions)",
]
containers = ["app.modules.*"]
exhaustive = true
exhaustive_ignores = ["__init__"]

# ---------------------------------------------------------------- Contract 2
# Top-level direction: app.core is generic infrastructure and may never import
# a domain module.
[[tool.importlinter.contracts]]
name = "Top-level layers: main -> api -> modules -> db -> core"
type = "layers"
layers = [
    "app.main",
    "app.api",
    "app.modules",
    "app.db",
    "app.core",
]

# ---------------------------------------------------------------- Contract 3
# Routers speak Pydantic, never infrastructure. allow_indirect_imports is
# mandatory here (not ignore_imports, which §7.9 forbids for this purpose):
# router -> dependencies -> repository -> sqlalchemy is legitimate DI wiring,
# and the flag restricts the check to *direct* imports, which is the actual
# rule.
[[tool.importlinter.contracts]]
name = "Routers must not touch persistence infrastructure"
type = "forbidden"
source_modules = ["app.modules.*.router"]
forbidden_modules = ["sqlalchemy", "asyncpg", "app.db"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Services must not import the web framework or raw infrastructure clients"
type = "forbidden"
source_modules = ["app.modules.*.service"]
forbidden_modules = ["fastapi", "starlette", "asyncpg", "app.db"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Repository stays free of web framework"
type = "forbidden"
source_modules = ["app.modules.*.repository"]
forbidden_modules = ["fastapi", "starlette"]

# ---------------------------------------------------------------- Contract 4
# Configuration is read through get_settings(), never os.environ (mirrors the
# ruff TID251 banned-api rule at the import-linter level).
[[tool.importlinter.contracts]]
name = "Only core.config may read the environment"
type = "forbidden"
source_modules = ["app.modules", "app.api", "app.db"]
forbidden_modules = ["os", "dotenv"]
allow_indirect_imports = true
