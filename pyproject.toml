[project]
name = "customer-portal"
version = "0.1.0"
description = "Customer Portal backend API — customer identity domain"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.14",
    "bcrypt>=4.1",
    "anyio>=4.0",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.3",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "ASYNC"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Use app.core.config.get_settings() instead of os.environ directly."
"os.getenv".msg = "Use app.core.config.get_settings() instead of os.getenv directly."

# Test fixtures legitimately set env vars to configure the process under test
# (e.g. pointing alembic's CLI at the ephemeral testcontainer database) — this
# is fixture wiring, not application runtime config, so the rule doesn't apply.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "unit: fast, no external services",
    "integration: requires Postgres via testcontainers",
]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Users module layers"
type = "layers"
layers = [
    "router",
    "dependencies",
    "service",
    "repository",
    "models",
    "schemas",
]
containers = ["app.modules.users"]
exhaustive = true
exhaustive_ignores = ["__init__"]

[[tool.importlinter.contracts]]
name = "Router stays free of persistence infrastructure"
type = "forbidden"
source_modules = ["app.modules.users.router"]
forbidden_modules = [
    "sqlalchemy",
    "app.core.database",
    "app.modules.users.repository",
    "app.modules.users.models",
]
# dependencies.py is the composition root: it is explicitly allowed to bridge
# router -> infrastructure. These edges are the intended DI wiring, not a leak;
# what this contract forbids is router.py *itself* naming infra directly.
ignore_imports = [
    "app.modules.users.dependencies -> app.core.database",
    "app.modules.users.dependencies -> app.modules.users.repository",
    "app.modules.users.dependencies -> sqlalchemy",
    "app.modules.users.service -> app.modules.users.models",
]

[[tool.importlinter.contracts]]
name = "Service stays free of web framework"
type = "forbidden"
source_modules = ["app.modules.users.service"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "Repository stays free of web framework"
type = "forbidden"
source_modules = ["app.modules.users.repository"]
forbidden_modules = ["fastapi", "starlette"]
