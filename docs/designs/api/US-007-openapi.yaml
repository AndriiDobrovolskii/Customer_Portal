openapi: 3.0.3
info:
  title: Refresh Token (US-2.3 / spec US-007) — fragment
  version: "1.0"
paths:
  /v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate a refresh token and issue a new access token
      tags: [auth]
      security:
        - refreshCookieAuth: []
      responses:
        "200":
          description: >
            Presented refresh token was valid, unconsumed, unexpired, and
            resolved to an eligible account (FR-1). Its `consumed_at` is
            set so it can never be reused; a new refresh token is issued
            in the same family, carrying forward the same `expires_at`
            (absolute cap) unchanged. Response body carries only
            `access_token`/`expires_in` — no `token_type` field, unlike
            login's `LoginResponse` (the source story's API Contract table
            states this exact shape and omits `token_type`; not treated as
            a gap to fill in here).
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refresh_token=<opaque>; Path=/v1/auth; HttpOnly; Secure; SameSite=Strict
              description: >
                The rotated refresh token, replacing the one just
                consumed. Attributes shown match the cookie login
                (US-2.1/US-005) already sets — this spec's FR-1 describes
                rotating "the cookie" without independently restating
                `HttpOnly`/`Secure`/`SameSite`, so this design carries
                those attributes forward from the existing mechanism
                rather than asserting them as a new requirement of this
                story. Flagged as an Open Question below.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          description: >
            One `token-invalid` envelope, reached via any of four FRs,
            deliberately indistinguishable at the response level (FR-3's
            "indistinguishable" requirement, resolved OD-3, applies to
            status+body only — not to server-side side effects):
              - FR-3: token unknown (no matching `refresh_tokens` row,
                including no cookie sent at all), or its `expires_at` has
                passed (this also covers FR-5's 30-day absolute cap, since
                `expires_at` is fixed at family creation and never
                extended — same check, no separate mechanism).
              - FR-2: token already consumed by a prior rotation (reuse).
                Unlike the other three cases, this one has server-side
                side effects invisible in the response: the whole family's
                `revoked_at` is set, a `severity=high` audit entry is
                written, and a security email is sent — none of that is
                reflected in this response body, preserving FR-3's
                indistinguishability. Checked immediately after a
                rate-limit pass (see `429` below), before FR-6/FR-4.
              - FR-6: account deactivated, or `revoke_before:{user_id}` is
                later than the token's `issued_at`. Checked after FR-2 (a
                reused token still alerts even against a now-deactivated
                account, resolved OD-5).
              - FR-4: token's `last_used_at` is more than 14 days in the
                past (idle timeout). Checked last, after FR-6.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/RefreshTokenInvalidProblem"
        "429":
          description: >
            More than 60 requests for this token's `family_id` within the
            trailing hour (resolved OD-1). Checked immediately after the
            presented token resolves to a `family_id` via the hash
            lookup — before the FR-3/FR-2/FR-6/FR-4 checks — so a client
            hammering a real family is throttled regardless of whether
            the specific call would otherwise succeed or 401. A token
            that doesn't resolve to any row at all (FR-3's "unknown" case)
            has no `family_id` to key this counter on and cannot trigger
            this response. Reuses the existing `too-many-attempts` type
            slug from login (US-2.1/US-005) rather than introducing a new
            one.
          headers:
            Retry-After:
              schema:
                type: integer
                description: Seconds until this family's rate-limit window clears.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/TooManyAttemptsProblem"
components:
  securitySchemes:
    refreshCookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: >
        The sole credential this endpoint accepts (per the source story's
        API Contract: "Refresh cookie"). Not a Bearer access token — an
        access token is neither required nor checked by this endpoint.
  schemas:
    RefreshResponse:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
          description: JWT, 15-minute TTL — same issuance mechanism as login (US-2.1/US-005), not reintroduced by this story.
        expires_in:
          type: integer
          enum: [900]
      description: >
        Field set matches the source story's API Contract table exactly:
        `{"access_token": str, "expires_in": 900}`. No `token_type` field
        (present in login's `LoginResponse` but not stated here) — this
        design does not add it, since the spec never states it either.
    RefreshTokenInvalidProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
      properties:
        type:
          type: string
          example: ".../errors/token-invalid"
        status:
          type: integer
          example: 401
      description: Type slug reused from US-1.2, per the spec's own statement that this story introduces no new error type slugs.
    TooManyAttemptsProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
      properties:
        type:
          type: string
          example: ".../errors/too-many-attempts"
        status:
          type: integer
          example: 429
      description: Type slug reused from login (US-2.1/US-005) — not a new slug introduced by this story.
    ProblemBase:
      type: object
      description: RFC 7807 problem body. `type` is an absolute/relative URI ending in the slug named per response.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          example: /v1/auth/refresh
