openapi: 3.0.3
info:
  title: Active Session Management (US-2.6 / spec US-010) — fragment
  version: "1.0"
paths:
  /v1/auth/sessions:
    get:
      operationId: listSessions
      summary: List every live session (refresh-token family) for the caller
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >
            One entry per live refresh-token family (FR-1). The caller's
            current family is identified by reading the optional
            `refresh_token` cookie and matching its hash to a live token
            (spec-review resolution); at most one entry is flagged
            `is_current`, and none is when the cookie is absent, expired,
            or matches no live token. Ordering is not specified by the
            source story or spec — implementation-defined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          description: No access token, or one that is expired/malformed (FR-5).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/UnauthenticatedProblem"
  /v1/auth/sessions/{family_id}:
    delete:
      operationId: revokeSession
      summary: Revoke one session (refresh-token family) by its family_id
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - name: family_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: >
            Every token in the family is revoked via US-2.2's existing
            revocation path (FR-2), or the call was already idempotent
            (FR-4: already-revoked, expired, or a `family_id` that doesn't
            resolve to a token the caller can act on — malformed or simply
            unknown both fold into FR-3's `404` instead, not this `204`;
            "already revoked" specifically means the row existed and
            belonged to the caller but was already inactive). An
            `auth_audit_log` entry (`event=session_revoked`,
            `target_family=<family_id>`) is written only when a live
            token was actually revoked by this call, not on the idempotent
            no-op path.
        "401":
          description: No access token, or one that is expired/malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/UnauthenticatedProblem"
        "404":
          description: >
            `family_id` belongs to a different user, is malformed, or
            matches no record at all (FR-3; malformed/unknown folded in
            by precedent). `403` is deliberately never used here — it
            would confirm the `family_id` exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/NotFoundProblem"
        "409":
          description: >
            `family_id` matches the caller's own current session, per the
            `refresh_token` cookie mechanism (FR-6). Never triggered when
            the cookie is absent or identifies no live family — that case
            falls through to the `204`/`404` paths above like any other
            family_id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/CurrentSessionProblem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionEntry"
    SessionEntry:
      type: object
      description: >
        No token value, token hash, or full IP address is ever included
        (FR-1) — this schema is exhaustive of what the endpoint returns.
      required: [family_id, created_at, last_used_at, device_label, is_current]
      properties:
        family_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Null only for a family that has never been used to refresh
            since its creation (i.e., `RefreshToken.last_used_at` is only
            set on rotation, per US-2.3's existing behavior).
        location:
          type: object
          nullable: true
          description: >
            Omitted/null when the IP is private/loopback or has no
            GeoLite2 database entry (OD-4) — the request never fails
            because of this.
          properties:
            city:
              type: string
              nullable: true
            country:
              type: string
              nullable: true
        device_label:
          type: string
          description: >
            Derived via the `user-agents` library (OD-3), formatted
            "{browser family} on {OS family}"; "Unknown device" when the
            User-Agent header is missing or unparseable.
        is_current:
          type: boolean
    ProblemBase:
      type: object
      description: RFC 7807 problem body. `type` is an absolute/relative URI ending in the slug named per response.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          example: /v1/auth/sessions/3fa85f64-5717-4562-b3fc-2c963f66afa6
    UnauthenticatedProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
      properties:
        type:
          type: string
          example: ".../errors/unauthenticated"
        status:
          type: integer
          example: 401
      description: >
        Reuses the project's existing shared unauthenticated envelope
        (`UnauthenticatedError`, `app/modules/users/exceptions.py`) — no
        new slug for this response.
    NotFoundProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
      properties:
        type:
          type: string
          example: ".../errors/not-found"
        status:
          type: integer
          example: 404
      description: >
        The one error slug the source story explicitly names (Error
        Envelope section: "not-found (shared)").
    CurrentSessionProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
      properties:
        type:
          type: string
          example: ".../errors/current-session"
        status:
          type: integer
          example: 409
      description: >
        New slug, not listed in the source story's Error Envelope
        section — introduced by the spec's resolution of Open Decision
        OD-1 (disclosed scope addition, see US-010 spec review).
