openapi: 3.0.3
info:
  title: Ticket Resolution (US-4.3 / spec US-4.3) — fragment
  version: "2"
x-story: US-4.3
x-source-specification: docs/specifications/US-4.3-spec.md
x-source-specification-version: 2
x-produced-by: openapi-designer
paths:
  /v1/support/tickets/{id}/resolve:
    post:
      operationId: resolveTicket
      summary: Agent marks a ticket resolved
      tags: [support, tickets, resolution]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveTicketRequest"
      responses:
        "200":
          description: >
            Status becomes "resolved", resolved_at is set (FR-1). Only agents
            holding tickets:write may resolve — see US-4.3-api-design.md
            check order (state validity checked before permission).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketStateRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Caller is the ticket's own requester but does not hold
            tickets:write (FR-7). Only reached if the ticket is NOT closed —
            a closed ticket returns 409 for every caller regardless of
            permission (state checked before actor, per the spec's own NFR).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/InsufficientPermissionProblem"
        "404":
          description: >
            Ticket does not exist, or the caller is a customer who is not
            this ticket's requester (FR-8). Never 403, to avoid confirming
            the ticket id exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/NotFoundProblem"
        "409":
          description: >
            Ticket status is "resolved" or "closed" (FR-6; not open,
            waiting_on_support, or waiting_on_customer per OD-5's resolve-
            eligible set). allowed_events lists the events actually valid
            from the ticket's current status. Also the response for the
            losing side of two simultaneous resolves (FR-9) — the
            conditional UPDATE affects zero rows and is reported identically
            to a pre-existing invalid state.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/InvalidStateTransitionProblem"
        "422":
          description: Empty or absent resolution_note (FR-10).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationFailedProblem"
  /v1/support/tickets/{id}/close:
    post:
      operationId: closeTicket
      summary: Requester or agent closes a ticket
      tags: [support, tickets, resolution]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseTicketRequest"
      responses:
        "200":
          description: >
            Status becomes "closed", closed_at is set (FR-2). Succeeds
            identically for the ticket's requester or an agent holding
            tickets:write — no further permission distinction beyond the
            ownership/scope check that already gated 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketStateRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >
            Ticket does not exist, or the caller is a customer who is
            neither this ticket's requester nor an agent holding
            tickets:write (FR-8).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/NotFoundProblem"
        "409":
          description: >
            Ticket status is already "closed". Not literally stated by any
            Acceptance Criterion (TC-AC5 names only /resolve and /reopen) —
            generalized from the story's own normative State Machine table,
            whose only row for "closed" is terminal. See US-4.3-api-design.md
            Open Questions #2.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/InvalidStateTransitionProblem"
  /v1/support/tickets/{id}/reopen:
    post:
      operationId: reopenTicket
      summary: Requester or agent reopens a resolved ticket directly
      tags: [support, tickets, resolution]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReopenTicketRequest"
      responses:
        "200":
          description: >
            Status becomes "waiting_on_support" (OD-1 — not "reopened",
            which is not part of tickets.status's shipped value set) and
            resolved_at is cleared (FR-5). Requires status "resolved" with
            now - resolved_at <= 7 days (inclusive, OD-4). Succeeds
            identically for the requester or an agent holding tickets:write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketStateRead"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >
            Ticket does not exist, or the caller is a customer who is
            neither this ticket's requester nor an agent holding
            tickets:write (FR-8).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/NotFoundProblem"
        "409":
          description: >
            Ticket status is "closed" (FR-6, TC-AC5 — literally covered), or
            is open/waiting_on_support/waiting_on_customer (never resolved,
            generalized from the normative State Machine table — see
            US-4.3-api-design.md Open Questions #2). Does NOT cover a
            "resolved" ticket outside the 7-day window but not yet
            auto-closed — that response is undefined by this contract, see
            US-4.3-api-design.md Open Questions #1.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/InvalidStateTransitionProblem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: No valid access token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/UnauthorizedProblem"
  schemas:
    ResolveTicketRequest:
      type: object
      required: [resolution_note]
      additionalProperties: false
      properties:
        resolution_note:
          type: string
          minLength: 1
          maxLength: 5000
          description: >
            Mandatory, non-empty (FR-10). maxLength matches the backing
            column US-4.3-db-design.md fixed to String(5000) — see
            US-4.3-api-design.md Open Questions #3 (resolved).
    CloseTicketRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: >
            Optional, carried from the source story's API Contract table.
            Not described by any FR (purpose, persistence, or audit-log
            visibility are undefined) — see US-4.3-api-design.md Open
            Questions #4.
    ReopenTicketRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: >
            Optional, carried from the source story's API Contract table.
            Not described by any FR — see US-4.3-api-design.md Open
            Questions #4.
    TicketStateRead:
      type: object
      required: [id, ticket_number, status, updated_at]
      properties:
        id:
          type: string
          format: uuid
        ticket_number:
          type: string
          example: "CP-2026-0000431"
        status:
          type: string
          enum: [open, waiting_on_support, waiting_on_customer, resolved, closed]
          description: >
            No "reopened" value — dropped from the source story's stated
            value set per OD-1, matching already-shipped US-4.2 behavior.
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: >
            Set by a successful /resolve; cleared by a successful /reopen or
            by an FR-4 reopening reply. Null otherwise.
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: Set by a successful /close or by the auto-close job (FR-3).
        updated_at:
          type: string
          format: date-time
      description: >
        Deliberately minimal: closed_by and resolution_note are not exposed
        by this contract — see US-4.3-api-design.md Open Questions #5.
    UnauthorizedProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
      properties:
        type:
          type: string
          example: ".../errors/unauthorized"
        status:
          type: integer
          example: 401
      description: Cross-cutting slug shared by every authenticated endpoint in this project.
    InsufficientPermissionProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
      properties:
        type:
          type: string
          example: ".../errors/insufficient-permission"
        status:
          type: integer
          example: 403
      description: >
        Reuses app/modules/roles/exceptions.py's InsufficientPermissionError
        slug/shape (FR-7), not a new one.
    NotFoundProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
      properties:
        type:
          type: string
          example: ".../errors/not-found"
        status:
          type: integer
          example: 404
      description: >
        Cross-cutting slug this project already uses (e.g.
        app/modules/support/exceptions.py's TicketNotFoundError, FR-4 of
        US-4.2) for a deliberately-generic "no such resource, or you cannot
        see it" case (FR-8).
    InvalidStateTransitionProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
      properties:
        type:
          type: string
          example: ".../errors/invalid-state-transition"
        status:
          type: integer
          example: 409
        allowed_events:
          type: array
          items:
            type: string
          description: >
            The events actually permitted from the ticket's current status
            (FR-6, per the spec's own Error Envelope Schema).
      required: [allowed_events]
      description: >
        Reuses the invalid-state-transition slug already shipped by
        app/modules/admin_users/exceptions.py::InvalidStateTransitionError
        (US-3.1) at the same 409 status, but adds allowed_events — a field
        that class does not carry. This story's own subclass, not an import
        of that one (module-ownership convention).
    ValidationFailedProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemBase"
      properties:
        type:
          type: string
          example: ".../errors/validation-failed"
        status:
          type: integer
          example: 422
        errors:
          type: array
          items:
            type: object
            required: [field, message, code]
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
      description: Reused cross-project slug and shape (app/core/exceptions.py's FieldError), not new here.
    ProblemBase:
      type: object
      description: RFC 7807 problem body. `type` is an absolute/relative URI ending in the slug named per response.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          example: /v1/support/tickets/{id}/resolve
