# SECURITY_REVIEW done 2026-09-02: docs/security/US-009-security-review.md -
# Pass (1 finding found+fixed same-day). 5/6 AGENTS.md SS7 rows clean on
# first read; rule 2 (no reversible encryption for credentials) required
# explicit reasoning - mfa_secret_encrypted's AES-GCM envelope encryption
# is correct, not a violation, because a TOTP secret must be recomputed-
# from to verify a code (no one-way hash is possible), unlike recovery
# codes (Argon2id-hashed, compare-only, correctly matching rule 1). Rule 6
# (uniform auth-failure response) surfaced a genuine defect: disable_mfa
# checked password then code sequentially, raising a different exception
# per factor (InvalidCredentialsError vs MfaInvalidCodeError) - since the
# code check only ran after the password check passed, the distinct
# mfa-invalid-code response already confirmed the password was correct, an
# oracle a stolen bearer session could use to brute-force each factor
# independently (this endpoint's whole purpose is joint two-factor
# defense against exactly that threat model). Fixed same-day:
# app/modules/users/service.py's disable_mfa now evaluates both factors
# unconditionally (no short-circuit, no timing signal) and raises one
# exception type on either failure; regression-guarded by a new
# indistinguishability test. Full gate re-run green: 7/7 pre-commit hooks,
# mypy strict clean, 361/361 tests (was 360 - added 1), 97.35% coverage.
# 3 Low advisory findings noted, none forcing a Fail.
